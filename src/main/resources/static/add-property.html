<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | EstatePro</title>


    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #18352b;
        }

        header {
            background: #123c2d;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #d5b56b;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }

        h1 {
            color: #123c2d;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1d704c;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #123c2d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d704c;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
        }
    </style>


</head>

<body>

<header>
    <div class="logo">Estate<span>Pro.</span></div>
    <a href="/agent-dashboard.html">← Dashboard</a>
</header>

<div class="container">


    <div class="form-card">

        <h1>Add New Property</h1>

        <p class="subtitle">
            Enter your property details to create a new listing.
        </p>

        <form id="propertyForm">

            <div class="form-group">
                <label>Property Title</label>
                <input type="text" name="title" placeholder="Example: Modern House in Colombo" required>
            </div>

            <div class="form-group">
                <label>Property Type</label>
                <select name="propertyType" required>
                    <option value="">Select Property Type</option>
                    <option value="House">House</option>
                    <option value="Apartment">Apartment</option>
                    <option value="Land">Land</option>
                    <option value="Commercial">Commercial Property</option>
                </select>
            </div>

            <div class="form-group">
                <label>Listing Type</label>
                <select name="listingType" required>
                    <option value="">Select Listing Type</option>
                    <option value="Sale">For Sale</option>
                    <option value="Rent">For Rent</option>
                </select>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="Example: Colombo, Sri Lanka" required>
            </div>

            <div class="form-group">
                <label>Price (LKR)</label>
                <input type="number" name="price" min="1" step="0.01" placeholder="Enter property price" required>
            </div>

            <div class="form-group">
                <label>Bedrooms</label>
                <input type="number" name="bedrooms" min="0" value="0" required>
            </div>

            <div class="form-group">
                <label>Bathrooms</label>
                <input type="number" name="bathrooms" min="0" value="0" required>
            </div>

            <div class="form-group">
                <label>Area (Square Feet)</label>
                <input type="number" name="area" min="0.01" step="0.01" placeholder="Enter property area" required>
            </div>

            <div class="form-group">
                <label>Property Description</label>
                <textarea name="description" placeholder="Describe your property..." required></textarea>
            </div>

            <button type="submit">Add Property</button>

        </form>

        <p id="message"></p>

    </div>


</div>

<footer>
    © 2026 EstatePro. All Rights Reserved.
</footer>

<script>

    document.getElementById("propertyForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const formData = new FormData(this);
        const data = new URLSearchParams(formData);

        const message = document.getElementById("message");

        try {

            const response = await fetch("/property/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: data
            });

            const result = await response.text();

            message.style.color = result.includes("successfully") ? "green" : "red";
            message.textContent = result;

            if (result.includes("successfully")) {
                this.reset();
            }

        } catch (error) {

            message.style.color = "red";
            message.textContent = "Something went wrong. Please try again.";

        }

    });

</script>

</body>
</html>
