<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Agents | EstatePro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>

<header>
    <div class="logo">Estate<span>Pro.</span></div>
    <div class="header-links">
        <a href="/admin-dashboard.html">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</header>

<div class="container">
    <h1>Manage Agents</h1>
    <p class="subtitle">View agent profiles and remove them when necessary.</p>

    <div id="message"></div>
    <div class="table-box" id="tableBox">Loading...</div>
</div>

<script src="/admin.js"></script>
<script>

    const box = document.getElementById("tableBox");

    async function loadAgents() {

        try {

            const agents = await getList("/agent/all");

            if (agents.length === 0) {
                showEmpty(box, "No agent profiles found.");
                return;
            }

            buildTable(box,
                ["Agent ID", "Name", "Email", "Agency", "Specialization", "Location", "Experience", "Rating", "Action"],
                agents,
                function (row, agent) {

                    makeCell(row, agent.agentId);
                    makeCell(row, agent.fullName);
                    makeCell(row, agent.email);
                    makeCell(row, agent.agencyName);
                    makeCell(row, agent.specialization);
                    makeCell(row, agent.location);
                    makeCell(row, agent.experienceYears + " yrs");
                    makeCell(row, agent.rating);

                    const actionCell = document.createElement("td");

                    actionCell.appendChild(makeButton("Delete", "red-btn", function () {
                        deleteAgent(agent.agentId);
                    }));

                    row.appendChild(actionCell);
                });

        } catch (error) {
            showEmpty(box, error.message);
        }
    }

    async function deleteAgent(agentId) {

        if (!confirm("Delete agent profile " + agentId + "?")) {
            return;
        }

        const response = await fetch("/agent/" + encodeURIComponent(agentId), {
            method: "DELETE"
        });

        const result = await response.text();

        showMessage(result, result.includes("successfully"));
        loadAgents();
    }

    loadAgents();

</script>
</body>
</html>
