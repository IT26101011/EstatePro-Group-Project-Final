
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Agents | EstatePro</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #18352b;
        }

        header {
            background: #123c2d;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #d5b56b;
        }

        .back-btn {
            background: #d5b56b;
            color: #123c2d;
            padding: 10px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 700;
        }

        .container {
            padding: 50px 7%;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .agent-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }

        .agent-card h3 {
            color: #123c2d;
            margin-bottom: 12px;
        }

        .agent-card p {
            color: #777;
            line-height: 1.7;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .rating {
            color: #b58b2b;
            font-weight: 700;
            margin-top: 12px;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #777;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 5%;
            }

            .welcome h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Estate<span>Pro.</span></div>
    <a href="/client-dashboard.html" class="back-btn">Back to Dashboard</a>
</header>

<div class="container">

    <div class="welcome">
        <h1>Explore Our Agents</h1>
        <p>Discover registered real estate agents and compare their customer ratings.</p>
    </div>

    <div class="agent-grid" id="agentList">
        <div class="message">Loading agents...</div>
    </div>

</div>

<footer>
    © 2026 EstatePro. All Rights Reserved.
</footer>

<script>

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }

    async function loadAgents() {

        const agentList = document.getElementById("agentList");

        try {

            const response = await fetch("/agent/all");

            if (response.status === 401 || response.status === 403) {
                agentList.innerHTML =
                    '<div class="message">Please login to explore agents.</div>';
                return;
            }

            if (!response.ok) {
                throw new Error("Unable to load agents.");
            }

            const agents = await response.json();

            if (!Array.isArray(agents) || agents.length === 0) {
                agentList.innerHTML =
                    '<div class="message">No agents are available yet.</div>';
                return;
            }

            agents.sort((a, b) =>
                Number(b.rating || 0) - Number(a.rating || 0)
            );

            agentList.innerHTML = agents.map(agent => `

                <div class="agent-card">

                    <h3>${escapeHTML(agent.agencyName)}</h3>

                    <p><strong>Agent ID:</strong>
                        ${escapeHTML(agent.agentId)}</p>

                    <p><strong>Email:</strong>
                        ${escapeHTML(agent.email)}</p>

                    <p><strong>Specialization:</strong>
                        ${escapeHTML(agent.specialization)}</p>

                    <p><strong>Location:</strong>
                        ${escapeHTML(agent.location)}</p>

                    <p><strong>Experience:</strong>
                        ${escapeHTML(agent.experienceYears)} years</p>

                    <p><strong>About:</strong>
                        ${escapeHTML(agent.description)}</p>

                    <div class="rating">
                        ★ Rating: ${Number(agent.rating || 0).toFixed(1)} / 5
                    </div>

                </div>

            `).join("");

        } catch (error) {

            agentList.innerHTML =
                '<div class="message">Could not load agents. Please try again later.</div>';

            console.error(error);
        }
    }

    loadAgents();

</script>

</body>
</html>
