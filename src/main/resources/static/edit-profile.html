
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | EstatePro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f7f3ea;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #171717;
        }

        .navbar-brand {
            color: #c9a227;
            font-weight: bold;
        }

        .profile-card {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .btn-gold {
            background: #c9a227;
            color: #171717;
            font-weight: bold;
        }

        .btn-gold:hover {
            background: #b18d1f;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <a class="navbar-brand" href="/client-dashboard.html">
        EstatePro
    </a>

    <a href="/profile.html" class="btn btn-outline-light">
        Back to Profile
    </a>
</nav>

<div class="container">

    <div class="profile-card">

        <h2 class="text-center mb-2">Edit Your Profile</h2>

        <p class="text-center text-muted mb-4">
            Update your personal account information.
        </p>

        <div id="message" class="alert d-none"></div>

        <form id="editProfileForm">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text"
                       id="fullName"
                       name="fullName"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email"
                       id="email"
                       class="form-control"
                       disabled>
                <small class="text-muted">
                    Email address cannot be changed.
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Account Role</label>
                <input type="text"
                       id="role"
                       class="form-control"
                       disabled>
            </div>

            <hr class="my-4">

            <h5>Change Password</h5>

            <p class="text-muted">
                Leave these fields empty if you do not want to change your password.
            </p>

            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password"
                       id="currentPassword"
                       name="currentPassword"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       class="form-control"
                       minlength="8">
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <input type="password"
                       id="confirmNewPassword"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-gold w-100">
                Save Changes
            </button>

        </form>

    </div>

</div>

<script>

    const messageBox = document.getElementById("message");

    // Display messages
    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "alert alert-" + type;
    }

    // Load existing profile details
    async function loadProfile() {

        try {
            const response = await fetch("/profile");
            const data = await response.json();

            if (!response.ok || data.error) {
                window.location.href = "/login.html";
                return;
            }

            document.getElementById("fullName").value = data.fullName;
            document.getElementById("email").value = data.email;
            document.getElementById("phone").value = data.phone;
            document.getElementById("role").value = data.role;

        } catch (error) {
            showMessage("Unable to load profile information.", "danger");
        }
    }

    // Update profile
    document.getElementById("editProfileForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmNewPassword =
                document.getElementById("confirmNewPassword").value;

            if (newPassword !== confirmNewPassword) {
                showMessage("New passwords do not match.", "danger");
                return;
            }

            if (newPassword && !currentPassword) {
                showMessage("Please enter your current password.", "danger");
                return;
            }

            if (newPassword && newPassword.length < 8) {
                showMessage("New password must contain at least 8 characters.", "danger");
                return;
            }

            const formData = new URLSearchParams();

            formData.append(
                "fullName",
                document.getElementById("fullName").value
            );

            formData.append(
                "phone",
                document.getElementById("phone").value
            );

            formData.append("currentPassword", currentPassword);
            formData.append("newPassword", newPassword);

            try {

                const response = await fetch("/profile/update", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                });

                const result = await response.text();

                if (result === "Profile updated successfully!") {

                    showMessage(result, "success");

                    setTimeout(() => {
                        window.location.href = "/profile.html";
                    }, 1200);

                } else {
                    showMessage(result, "danger");
                }

            } catch (error) {
                showMessage("Something went wrong. Please try again.", "danger");
            }

        });

    // Load profile when page opens
    loadProfile();

</script>

</body>
</html>
