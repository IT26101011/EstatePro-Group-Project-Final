<body>

<header>
    <div class="logo">EstatePro</div>
    <a href="/client-dashboard.html" class="back-btn">Dashboard</a>
</header>

<div class="container">


    <h1>My Appointments</h1>
    <p class="subtitle">Manage your property appointments.</p>

    <div id="message"></div>
    <div id="appointments">Loading appointments...</div>


</div>

<script>
    const container = document.getElementById("appointments");

    async function loadAppointments() {
        container.textContent = "Loading appointments...";

        try {
            const response = await fetch("/appointment/my-appointments");
            const result = await response.json();

            if (!response.ok || !Array.isArray(result)) {
                throw new Error("Unable to load appointments. Please login as Client.");
            }

            container.innerHTML = "";

            if (result.length === 0) {
                container.innerHTML =
                    '<div class="empty"><h3>No Appointments Found</h3><p>You have not booked any appointments yet.</p></div>';
                return;
            }

            for (const appointment of result) {
                await displayAppointment(appointment);
            }

        } catch (error) {
            container.textContent = error.message;
        }
    }

    async function displayAppointment(appointment) {
        let title = appointment.propertyId;
        let location = "Not available";

        try {
            const response = await fetch(
                "/property/" + encodeURIComponent(appointment.propertyId)
            );

            if (response.ok) {
                const property = await response.json();
                title = property.title || title;
                location = property.location || location;
            }
        } catch (error) {
            console.log("Property details unavailable.");
        }

        const card = document.createElement("div");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";

        const heading = document.createElement("div");

        const propertyTitle = document.createElement("div");
        propertyTitle.className = "property-title";
        propertyTitle.textContent = title;

        const id = document.createElement("small");
        id.textContent = "Appointment ID: " + appointment.appointmentId;

        heading.append(propertyTitle, id);

        const status = document.createElement("span");
        const validStatuses = ["PENDING", "APPROVED", "REJECTED", "COMPLETED"];
        const currentStatus = validStatuses.includes(appointment.status)
            ? appointment.status
            : "PENDING";

        status.className = "status " + currentStatus;
        status.textContent = currentStatus;

        header.append(heading, status);
        card.appendChild(header);

        const details = document.createElement("div");
        details.className = "details";

        addDetail(details, "Location", location);
        addDetail(details, "Date", appointment.appointmentDate);
        addDetail(details, "Time", appointment.appointmentTime);
        addDetail(details, "Agent", appointment.agentEmail);
        addDetail(details, "Message", appointment.message || "No message");

        card.appendChild(details);

        if (currentStatus === "PENDING") {
            const edit = document.createElement("button");
            edit.className = "edit-btn";
            edit.textContent = "Edit";
            edit.onclick = function () {
                editAppointment(appointment);
            };

            const cancel = document.createElement("button");
            cancel.className = "cancel-btn";
            cancel.textContent = "Cancel";
            cancel.onclick = function () {
                cancelAppointment(appointment.appointmentId);
            };

            card.append(edit, cancel);
        }

        container.appendChild(card);
    }

    function addDetail(parent, label, value) {
        const div = document.createElement("div");
        div.className = "detail";

        const name = document.createElement("span");
        name.textContent = label;

        const content = document.createElement("strong");
        content.textContent = value || "Not available";

        div.append(name, content);
        parent.appendChild(div);
    }

    async function editAppointment(appointment) {
        const date = prompt("New date (YYYY-MM-DD):", appointment.appointmentDate);
        if (date === null) return;

        const time = prompt("New time (HH:MM):", appointment.appointmentTime);
        if (time === null) return;

        const message = prompt("Message:", appointment.message || "");
        if (message === null) return;

        const data = new URLSearchParams();
        data.append("appointmentId", appointment.appointmentId);
        data.append("appointmentDate", date);
        data.append("appointmentTime", time);
        data.append("message", message);

        sendRequest("/appointment/update", data);
    }

    async function cancelAppointment(id) {
        if (!confirm("Are you sure you want to cancel this appointment?")) {
            return;
        }

        const data = new URLSearchParams();
        data.append("appointmentId", id);

        sendRequest("/appointment/delete", data);
    }

    async function sendRequest(url, data) {
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: data
            });

            const result = await response.text();
            const message = document.getElementById("message");

            message.textContent = result;
            message.style.color = result.includes("successfully")
                ? "#087443"
                : "#b42318";

            if (result.includes("successfully")) {
                loadAppointments();
            }

        } catch (error) {
            document.getElementById("message").textContent =
                "Request failed. Please try again.";
        }
    }

    loadAppointments();
</script>
