<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Properties | EstatePro</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #18352b;
        }

        header {
            background: #123c2d;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #d5b56b;
        }

        .back-btn {
            background: #d5b56b;
            color: #123c2d;
            padding: 10px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 700;
        }

        .container {
            padding: 50px 7%;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .properties {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .property-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }

        .property-card h3 {
            color: #123c2d;
            margin-bottom: 15px;
        }

        .property-card p {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .price {
            color: #1d704c !important;
            font-size: 20px;
            font-weight: 800;
            margin-top: 15px;
        }

        .message {
            color: #777;
            margin-top: 25px;
        }

        .add-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #123c2d;
            color: white;
            border-radius: 7px;
            text-decoration: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .edit-btn, .delete-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            color: white;
        }

        .edit-btn {
            background: #1d704c;
        }

        .edit-btn:hover {
            background: #123c2d;
        }

        .delete-btn {
            background: #c0392b;
        }

        .delete-btn:hover {
            background: #922b21;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
        }

        /* EDIT MODAL */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: modalOpen 0.25s ease;
        }

        @keyframes modalOpen {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #123c2d;
            font-size: 23px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #777;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
            color: #18352b;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1d704c;
            box-shadow: 0 0 0 2px rgba(29,112,76,0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .cancel-btn, .save-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .cancel-btn {
            background: #eee;
            color: #444;
        }

        .save-btn {
            background: #123c2d;
            color: white;
        }

        .save-btn:hover {
            background: #1d704c;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .modal {
                padding: 20px;
            }

            header {
                padding: 18px 5%;
            }

            .container {
                padding: 35px 5%;
            }
        }

    </style>
</head>

<body>

<header>
    <div class="logo">Estate<span>Pro.</span></div>
    <a href="/agent-dashboard.html" class="back-btn">Back to Dashboard</a>
</header>

<div class="container">

    <h1>My Properties</h1>
    <p class="subtitle">View and manage all your property listings.</p>

    <div id="properties" class="properties">
        <p class="message">Loading properties...</p>
    </div>

    <p id="message" class="message"></p>

    <a href="/add-property.html" class="add-btn">+ Add New Property</a>

</div>

<!-- EDIT PROPERTY MODAL -->

<div class="modal-overlay" id="editModal">

    <div class="modal">

        <div class="modal-header">
            <h2>Edit Property</h2>
            <button type="button" class="close-btn" onclick="closeEditModal()">&times;</button>
        </div>

        <form id="editPropertyForm">

            <input type="hidden" id="editPropertyId">

            <div class="form-group">
                <label>Property Title</label>
                <input type="text" id="editTitle" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Property Type</label>
                    <select id="editPropertyType" required>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Land">Land</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Listing Type</label>
                    <select id="editListingType" required>
                        <option value="Sale">Sale</option>
                        <option value="Rent">Rent</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" id="editLocation" required>
            </div>

            <div class="form-group">
                <label>Price (LKR)</label>
                <input type="number" id="editPrice" min="0.01" step="0.01" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Bedrooms</label>
                    <input type="number" id="editBedrooms" min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label>Bathrooms</label>
                    <input type="number" id="editBathrooms" min="0" step="1" required>
                </div>

            </div>

            <div class="form-group">
                <label>Area (Square Feet)</label>
                <input type="number" id="editArea" min="0.01" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription" required></textarea>
            </div>

            <div class="modal-actions">

                <button type="button" class="cancel-btn" onclick="closeEditModal()">
                    Cancel
                </button>

                <button type="submit" class="save-btn" id="saveButton">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

<footer>
    © 2026 EstatePro. All Rights Reserved.
</footer>

<script>

    async function loadProperties() {

        const container = document.getElementById("properties");
        const message = document.getElementById("message");

        try {

            const response = await fetch("/property/my-properties");

            if (response.status === 401 || response.status === 403) {
                window.location.href = "/login.html";
                return;
            }

            if (!response.ok) {
                throw new Error("Unable to load properties.");
            }

            const properties = await response.json();

            container.innerHTML = "";

            if (properties.length === 0) {
                message.textContent = "You have not added any properties yet.";
                return;
            }

            message.textContent = "";

            properties.forEach(property => {

                const card = document.createElement("div");
                card.className = "property-card";

                card.innerHTML = `
                    <h3>${escapeHTML(property.title)}</h3>

                    <p><strong>Property ID:</strong> ${escapeHTML(property.propertyId)}</p>

                    <p><strong>Type:</strong> ${escapeHTML(property.propertyType)}</p>

                    <p><strong>Listing:</strong> ${escapeHTML(property.listingType)}</p>

                    <p><strong>Location:</strong> ${escapeHTML(property.location)}</p>

                    <p><strong>Bedrooms:</strong> ${property.bedrooms}</p>

                    <p><strong>Bathrooms:</strong> ${property.bathrooms}</p>

                    <p><strong>Area:</strong> ${property.area} sq.ft</p>

                    <p class="price">LKR ${Number(property.price).toLocaleString()}</p>

                    <p>${escapeHTML(property.description)}</p>

                    <div class="action-buttons">

                        <button class="edit-btn" type="button">
                            Edit
                        </button>

                        <button class="delete-btn" type="button">
                            Delete
                        </button>

                    </div>
                `;

                const buttons = card.querySelectorAll("button");

                buttons[0].addEventListener("click", () => {
                    editProperty(property);
                });

                buttons[1].addEventListener("click", () => {
                    deleteProperty(property.propertyId);
                });

                container.appendChild(card);

            });

        } catch (error) {

            container.innerHTML = "";
            message.textContent = error.message;

        }
    }


    // OPEN EDIT MODAL

    function editProperty(property) {

        document.getElementById("editPropertyId").value = property.propertyId;

        document.getElementById("editTitle").value = property.title;
        document.getElementById("editPropertyType").value = property.propertyType;
        document.getElementById("editListingType").value = property.listingType;
        document.getElementById("editLocation").value = property.location;
        document.getElementById("editPrice").value = property.price;
        document.getElementById("editBedrooms").value = property.bedrooms;
        document.getElementById("editBathrooms").value = property.bathrooms;
        document.getElementById("editArea").value = property.area;
        document.getElementById("editDescription").value = property.description;

        document.getElementById("editModal").classList.add("active");

    }


    // CLOSE EDIT MODAL

    function closeEditModal() {

        document.getElementById("editModal").classList.remove("active");

    }


    // UPDATE PROPERTY

    document.getElementById("editPropertyForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const saveButton = document.getElementById("saveButton");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            const formData = new URLSearchParams();

            formData.append("propertyId", document.getElementById("editPropertyId").value);
            formData.append("title", document.getElementById("editTitle").value);
            formData.append("propertyType", document.getElementById("editPropertyType").value);
            formData.append("listingType", document.getElementById("editListingType").value);
            formData.append("location", document.getElementById("editLocation").value);
            formData.append("price", document.getElementById("editPrice").value);
            formData.append("bedrooms", document.getElementById("editBedrooms").value);
            formData.append("bathrooms", document.getElementById("editBathrooms").value);
            formData.append("area", document.getElementById("editArea").value);
            formData.append("description", document.getElementById("editDescription").value);

            const response = await fetch("/property/update", {

                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: formData

            });

            const result = await response.text();

            if (response.ok && result.toLowerCase().includes("success")) {

                closeEditModal();

                document.getElementById("message").textContent = result;

                await loadProperties();

            } else {

                alert(result);

            }

        } catch (error) {

            alert("Error updating property: " + error.message);

        } finally {

            saveButton.disabled = false;
            saveButton.textContent = "Save Changes";

        }

    });


    // DELETE PROPERTY

    async function deleteProperty(propertyId) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this property?"
        );

        if (!confirmDelete) {
            return;
        }

        try {

            const formData = new URLSearchParams();
            formData.append("propertyId", propertyId);

            const response = await fetch("/property/delete", {

                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: formData

            });

            const result = await response.text();

            alert(result);

            if (response.ok && result.toLowerCase().includes("success")) {

                loadProperties();

            }

        } catch (error) {

            alert("Error deleting property: " + error.message);

        }

    }


    // ESCAPE HTML

    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, function(character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[character];

        });

    }


    // CLOSE MODAL WHEN CLICKING OUTSIDE

    document.getElementById("editModal").addEventListener("click", function(event) {

        if (event.target === this) {
            closeEditModal();
        }

    });


    loadProperties();

</script>

</body>
</html>
