    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: #f5f7f5;
        }

        .left-panel {
            width: 42%;
            background: linear-gradient(135deg, #123b30, #071f19);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 65px;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 60px;
        }

        .brand span {
            color: #d9b66f;
        }

        .left-panel h1 {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .left-panel p {
            color: #c5d5ce;
            line-height: 1.8;
        }

        .right-panel {
            width: 58%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 25px;
        }

        .register-box {
            width: 100%;
            max-width: 500px;
        }

        .register-box h2 {
            font-size: 32px;
            color: #173d32;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #1c604b;
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            background: #174b3b;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-btn:hover {
            background: #10372a;
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        a {
            color: #1c604b;
            text-decoration: none;
            font-weight: 600;
        }

        @media(max-width: 850px) {
            .left-panel {
                display: none;
            }

            .right-panel {
                width: 100%;
            }
        }

        @media(max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>


</head>

<body>

<div class="left-panel">


    <div class="brand">Estate<span>Pro.</span></div>

    <h1>Find Your Perfect Place to Call Home.</h1>

    <p>
        Join EstatePro today and discover trusted real estate agents,
        explore properties and manage your appointments easily.
    </p>


</div>

<div class="right-panel">


    <div class="register-box">

        <h2>Create Account</h2>

        <p class="subtitle">
            Enter your details to create your EstatePro account.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone"
                           placeholder="Phone number" required>
                </div>

                <div class="form-group">
                    <label>Account Type</label>
                    <select name="role" required>
                        <option value="">Select role</option>
                        <option value="CLIENT">Client</option>
                        <option value="AGENT">Agent</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="8" required>
            </div>

            <button type="submit" class="register-btn" id="registerButton">
                Create Account
            </button>

            <p id="message"></p>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

    </div>


</div>

<script>

    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        const formData = new FormData(registerForm);
        const password = formData.get("password");
        const confirmPassword = formData.get("confirmPassword");

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match!";
            return;
        }

        button.disabled = true;
        button.textContent = "Creating Account...";

        message.textContent = "";

        try {

            const response = await fetch("/register", {
                method: "POST",
                body: new URLSearchParams(formData)
            });

            const result = await response.text();

            message.textContent = result;

            if (response.ok && result === "Registration successful!") {

                message.style.color = "green";
                registerForm.reset();

            } else {

                message.style.color = "red";

            }

        } catch (error) {

            message.style.color = "red";
            message.textContent = "Something went wrong. Please try again.";

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";

        }

    });

</script>

</body>
</html>
